name: Build, test and package
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.18.0'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: node scripts/load-check.mjs
      - run: node scripts/full-package.mjs
      - run: node scripts/check-package.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: full-package-${{ matrix.os }}
          path: full-package/full-package.zip
